<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAINS.LMS - Learning Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --primary-color: #1e40af;
            --secondary-color: #0369a1;
            --accent-color: #0ea5e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card-course {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card-course:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(30, 64, 175, 0.2);
        }

        .task-item {
            padding: 12px;
            background: white;
            border-left: 4px solid var(--accent-color);
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .task-item.completed {
            opacity: 0.7;
        }
    </style>
</head>

<body class="bg-gray-50">

<!-- ================= LOGIN PAGE ================= -->
<div id="loginPage" class="min-h-screen bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-2xl w-full max-w-md p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-600 rounded-lg mx-auto mb-4 flex items-center justify-center text-white text-2xl font-bold">
                BL
            </div>
            <h1 class="text-3xl font-bold text-gray-800">BRAINS.LMS</h1>
            <p class="text-gray-500">Learning Management System</p>
        </div>

        <form>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Email / NIM</label>
                <input id="username" type="text" class="w-full px-4 py-2 border rounded-lg" required>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">Password</label>
                <input id="password" type="password" class="w-full px-4 py-2 border rounded-lg" required>
            </div>

            <button type="button" onclick="handleLogin()"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                Masuk
            </button>
        </form>
    </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboardPage" class="hidden min-h-screen flex">

    <aside class="w-64 bg-white border-r">
        <div class="p-6 font-bold text-lg">BRAINS LMS</div>
        <nav class="p-4 space-y-2">
            <button onclick="showBeranda()" class="block w-full text-left p-2 hover:bg-gray-100">🏠 Beranda</button>
            <button onclick="showNilai()" class="block w-full text-left p-2 hover:bg-gray-100">📊 Nilai</button>
        </nav>
    </aside>

    <main class="flex-1 p-8">
        <h1 id="pageTitle" class="text-2xl font-bold mb-4">Beranda</h1>

        <div id="berandaContent">
            <p>Selamat datang di sistem LMS.</p>
        </div>

        <div id="nilaiContent" class="hidden">
            <table class="w-full border">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="p-2">Mata Kuliah</th>
                        <th class="p-2">Nilai</th>
                    </tr>
                </thead>
                <tbody id="nilaiTable"></tbody>
            </table>
        </div>
    </main>
</div>

<script>
const coursesData = {
    1: {
        title: 'Algoritma',
        dosen: 'Dr. Budi',
        tasks: [
            { title: 'Tugas 1', score: 90 }
        ]
    }
};

function handleLogin() {
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('dashboardPage').classList.remove('hidden');
}

function showBeranda() {
    document.getElementById('berandaContent').classList.remove('hidden');
    document.getElementById('nilaiContent').classList.add('hidden');
}

function showNilai() {
    document.getElementById('berandaContent').classList.add('hidden');
    document.getElementById('nilaiContent').classList.remove('hidden');

    const table = document.getElementById('nilaiTable');
    table.innerHTML = `
        <tr>
            <td class="p-2">Algoritma</td>
            <td class="p-2">90</td>
        </tr>
    `;
}
</script>

</body>
</html>
